# Document comparison rules and thresholds

confidence_threshold: 0.95

field_rules:
  # Exact match required
  exact_match:
    - loan_number
    - certificate_number
    - tracking_number

  # Fuzzy matching with tolerance.
  # `algorithm` selects the scoring strategy (see src/comparators/strategies.py:
  # jaccard | levenshtein). `threshold` is the active cutoff; it must travel
  # with the algorithm, so `algorithm_thresholds` records the calibrated cutoff
  # per algorithm (from reports/ab_accuracy_report.md). When `threshold` is
  # omitted the loader picks `algorithm_thresholds[algorithm]`.
  fuzzy_match:
    name_fields:
      algorithm: jaccard
      threshold: 0.85
      algorithm_thresholds:
        jaccard: 0.85
        levenshtein: 0.97
      fields:
        - borrower_name
        - original_borrower
        - new_borrower
        - recipient_name
    address_fields:
      algorithm: jaccard
      threshold: 0.80
      algorithm_thresholds:
        jaccard: 0.80
        levenshtein: 0.98
      fields:
        - property_address
        - recipient_address

  # Numeric comparison with tolerance
  amount_fields:
    tolerance: 0.01
    fields:
      - loan_amount
      - original_amount
      - current_balance
      - new_payment_amount

  # Rate comparison
  rate_fields:
    tolerance: 0.001
    fields:
      - interest_rate
      - new_interest_rate
      - coverage_percentage

# Critical fields that trigger rejection on mismatch
critical_fields:
  - loan_number
  - loan_amount
  - interest_rate
  - maturity_date
  - new_payment_amount
  - new_interest_rate
  - coverage_percentage

# Document types and their expected fields
document_type_fields:
  loan_modification:
    required:
      - loan_number
      - borrower_name
      - modification_date
      - new_payment_amount
    optional:
      - new_interest_rate
      - new_maturity_date
      - property_address

  mi_certificate:
    required:
      - loan_number
      - certificate_number
      - coverage_percentage
      - effective_date
    optional:
      - borrower_name
      - insurer_name
