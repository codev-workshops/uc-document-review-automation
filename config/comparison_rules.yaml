# Document comparison rules and thresholds

confidence_threshold: 0.95

field_rules:
  # Exact match required
  exact_match:
    - loan_number
    - certificate_number
    - tracking_number

  # Fuzzy matching with tolerance
  fuzzy_match:
    algorithm: jaccard
    name_fields:
      threshold: 0.85
      fields:
        - borrower_name
        - original_borrower
        - new_borrower
        - recipient_name
    name_noise:
      - mr
      - mrs
      - ms
      - dr
      - jr
      - sr
      - ii
      - iii
      - iv
    address_abbreviations:
      street: st
      avenue: ave
      boulevard: blvd
      drive: dr
      lane: ln
      road: rd
      court: ct
      place: pl
      circle: cir
      apartment: apt
      suite: ste
      building: bldg
      north: n
      south: s
      east: e
      west: w
    address_fields:
      threshold: 0.80
      fields:
        - property_address
        - recipient_address

  # Numeric comparison with tolerance
  amount_fields:
    tolerance: 0.01
    relative_tolerance: 0.0
    fields:
      - loan_amount
      - original_amount
      - current_balance
      - new_payment_amount

  # Rate comparison
  rate_fields:
    tolerance: 0.001
    fields:
      - interest_rate
      - new_interest_rate
      - coverage_percentage

  date_fields:
    fields:
      - maturity_date
      - new_maturity_date
      - modification_date
      - effective_date

# Critical fields that trigger rejection on mismatch
critical_fields:
  - loan_number
  - loan_amount
  - interest_rate
  - maturity_date
  - new_payment_amount
  - new_interest_rate
  - coverage_percentage

low_confidence_threshold: 0.90

# Document types and their expected fields
document_type_fields:
  loan_modification:
    required:
      - loan_number
      - borrower_name
      - modification_date
      - new_payment_amount
    optional:
      - new_interest_rate
      - new_maturity_date
      - property_address

  mi_certificate:
    required:
      - loan_number
      - certificate_number
      - coverage_percentage
      - effective_date
    optional:
      - borrower_name
      - insurer_name
